<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>La Tavola | Adminisztráció</title>
</head>
<body>
<header>
    <div class="logo">
        <img src="logo.jpg" alt="almakompot logó" height="40">
        Almakompót | Admin
    </div>
    <div>
        <a href="/">Vissza a vendégoldalra</a>
        <form action="/logout" method="post" style="display:inline">
            <button type="submit" class="secondary">Kijelentkezés</button>
        </form>
    </div>
</header>

<main>
    <h1>Éttermi adminisztráció</h1>
    <p class="muted">Foglalások és éttermi asztalok kezelése.</p>
    <section class="stats">
        <div class="stat">
            Összes foglalás
            <div class="stat-number" id="totalCount">–</div>
        </div>
        <div class="stat">
            Függőben
            <div class="stat-number" id="pendingCount">–</div>
        </div>
        <div class="stat">
            Megerősítve
            <div class="stat-number" id="confirmedCount">–</div>
        </div>
    </section>
    <section class="panel">
        <h2>Foglalások</h2>
        <div class="toolbar">
            <input id="search" type="search" placeholder="Keresés név vagy e-mail alapján">
            <input id="dateFilter" type="date" title="Szűrés dátum alapján">
            <select id="statusFilter">
                <option value="">Minden állapot</option>
                <option value="PENDING">Függőben</option>
                <option value="CONFIRMED">Megerősítve</option>
                <option value="CANCELLED">Lemondva</option>
            </select>
            <button id="refreshButton" type="button">Frissítés</button>
            <button id="clearFilters" class="secondary" type="button">Szűrők törlése</button>
        </div>
        <div id="reservationMessage" class="message" role="status"></div>
        <div class="table-wrapper">
            <table>
                <thead>
                <tr>
                    <th>Vendég</th>
                    <th>Időpont</th>
                    <th>Asztal</th>
                    <th>Létszám</th>
                    <th>Kérés</th>
                    <th>Állapot</th>
                    <th>Műveletek</th>
                </tr>
                </thead>
                <tbody id="reservationRows"></tbody>
            </table>
        </div>
    </section>
</main>

</body>
</html>
